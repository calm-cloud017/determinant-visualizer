<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维空间中的行列式可视化</title>
    <link rel="stylesheet" href="control-panel.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!-- 给 p5 画布预留的容器 -->
  <div id="canvas-container"></div>

<div id="control-panel" class="panel-open">
  <!-- 面板头部：标题和折叠按钮 -->
  <div class="panel-header">
    <button id="toggle-btn" title="折叠/展开">▶</button>
    <h2>参数控制台</h2>
  </div>

  <!-- 折叠区域（内容区） -->
  <div class="panel-content">
    <!-- 向量 a 控制组 -->
    <div class="control-group color-a">
      <h3>向量 a (黄色)</h3>
      
      <div class="slider-row">
        <label>角度: <span id="val-a-angle">0</span>°</label>
        <div class="input-wrapper">
          <button class="step-btn" data-target="a-angle" data-step="-1">-</button>
          <input type="range" id="slider-a-angle" min="0" max="360" value="0">
          <button class="step-btn" data-target="a-angle" data-step="1">+</button>
        </div>
      </div>

      <div class="slider-row">
        <label>长度: <span id="val-a-length">2</span></label>
        <div class="input-wrapper">
          <button class="step-btn" data-target="a-length" data-step="-0.1">-</button>
          <input type="range" id="slider-a-length" min="0" max="10" step="0.1" value="2">
          <button class="step-btn" data-target="a-length" data-step="0.1">+</button>
        </div>
      </div>
    </div>

    <hr>

    <!-- 向量 b 控制组 -->
    <div class="control-group color-b">
      <h3>向量 b (粉色)</h3>
      
      <div class="slider-row">
        <label>角度: <span id="val-b-angle">90</span>°</label>
        <div class="input-wrapper">
          <button class="step-btn" data-target="b-angle" data-step="-1">-</button>
          <input type="range" id="slider-b-angle" min="0" max="360" value="90">
          <button class="step-btn" data-target="b-angle" data-step="1">+</button>
        </div>
      </div>

      <div class="slider-row">
        <label>长度: <span id="val-b-length">2</span></label>
        <div class="input-wrapper">
          <button class="step-btn" data-target="b-length" data-step="-0.1">-</button>
          <input type="range" id="slider-b-length" min="0" max="10" step="0.1" value="2">
          <button class="step-btn" data-target="b-length" data-step="0.1">+</button>
        </div>
      </div>
    </div>

    <!-- 重置按钮 -->
    <button id="reset-btn">重置默认值</button>
  </div>
</div>

    <script src="./js/p5.min.js"></script>
    <script src="./js/determinant-visualizer.js"></script>

</body>
</html>
